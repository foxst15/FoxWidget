name: Build FoxWidget v3.0 Liquid Glass APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Platform 36 (dùng SDK có sẵn trên runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: FoxWidget-Android-Project-v3.3/FoxWidget_v3
        run: gradle assembleDebug

      - name: Upload FoxWidget v3.0 Liquid Glass APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxWidget-v3.0-LiquidGlass-apk
          path: FoxWidget-Android-Project-v3.3/FoxWidget_v3/app/build/outputs/apk/debug/app-debug.apk

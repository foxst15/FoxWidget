name: Build FoxWidget v1.0 Liquid Glass APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate & save Keystore (tự tạo 1 lần duy nhất)
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 4 -name "settings.gradle*" | head -n 1))
          KEYSTORE_PATH="$PROJECT_DIR/app/foxwidget.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -keyalg RSA -keysize 2048 -validity 10000 -alias foxwidget -storepass foxstudio123 -keypass foxstudio123 -dname "CN=FoxST, OU=FoxStudio, O=FoxStudio, C=VN"
            git config user.name "FoxStudio Bot"
            git config user.email "actions@github.com"
            git add -f "$KEYSTORE_PATH"
            git commit -m "chore: add permanent foxwidget.jks keystore"
            git push
          fi

      - name: Install Android SDK Platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 4 -name "settings.gradle*" | head -n 1))
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/output_apk/"

      - name: Upload FoxWidget APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxWidget-v1.0-apk
          path: output_apk/*.apk
